<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Huge text</title></head>
<body style="font-family:system-ui"><h1>Terms of service (very long)</h1><div id="tos"></div><button id="agree">I agree to the terms</button><div id="out"></div>
<script>let t='';for(let i=0;i<4000;i++)t+=`<p>Clause ${i}: The party of the first part shall indemnify the party of the second part against all claims arising under section ${i%97}.</p>`;tos.innerHTML=t;agree.onclick=()=>out.textContent='DONE: agreed';</script>
</body></html>
