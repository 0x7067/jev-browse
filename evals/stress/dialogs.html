<!doctype html><html lang="en"><head><meta charset="utf-8"><title>JS dialogs</title></head>
<body style="font-family:system-ui"><h1>Native dialogs</h1><button id="del">Delete account</button><div id="out"></div>
<script>del.onclick=()=>{if(confirm('Really delete?')){alert('Deleted.');out.textContent='DONE: account deleted';}};</script>
</body></html>
