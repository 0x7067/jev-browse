<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Upload</title></head>
<body style="font-family:system-ui"><h1>File upload</h1>
<label>Attachment <input type="file" id="f"></label> <button id="send">Send attachment</button><div id="out"></div>
<script>send.onclick=()=>out.textContent=f.files.length?'DONE: uploaded '+f.files[0].name:'No file chosen';</script>
</body></html>
