<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Inventory pages</title>
<h1>Inventory pages</h1>
<p id="content">Page 1 of 5: inventory entries 1–10</p>
<button id="next">Next page</button>
<script>
let page = 1;
document.querySelector('#next').onclick = () => {
  page++;
  document.querySelector('#content').textContent = page === 5 ? 'Page 5 of 5: Inventory review complete' : `Page ${page} of 5: inventory entries ${(page - 1) * 10 + 1}–${page * 10}`;
  if (page === 5) document.querySelector('#next').remove();
};
</script>
</html>
